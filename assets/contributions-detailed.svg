<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 785 307" width="785" height="307" role="img" aria-label="Aciole Contributions awaiting data sync">
    <style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .surface{fill:#1b1b1d;fill-opacity:.94}
  .primary{fill:#eceaf1}.muted{fill:#95919d}.accent{fill:#995ee9}
  .rule{stroke:#39363d}.empty{fill:#32243d}
  @media(prefers-color-scheme:light){
    .surface{fill:#f4f1f8;fill-opacity:.92}
    .primary{fill:#24202b}.muted{fill:#746f7e}.accent{fill:#7a39d1}
    .rule{stroke:#dcd4e4}.empty{fill:#e7dff0}
  }
</style>
    <rect class="surface" width="785" height="307" rx="25"/>
    <text class="primary" x="32" y="100" font-size="24" font-weight="650">Aciole Contributions</text>
    <text class="muted" x="32" y="134" font-size="15">Waiting for first GitHub Actions sync</text>
    <text x="32" y="165" font-size="12" fill="#c393ff">Actions → Update contribution heatmap</text>
  </svg>