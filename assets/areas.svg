<svg xmlns="http://www.w3.org/2000/svg" width="520" height="170" viewBox="0 0 520 170" role="img" aria-labelledby="title desc">
  <title id="title">Areas</title>
  <desc id="desc">Software Engineering, UI/UX, Design Systems, AI, Hardware, Electronics and Tools</desc>

  <style>
    .card { fill: #0d1117; stroke: #30363d; }
    .title { fill: #f0f6fc; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .text { fill: #c9d1d9; font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .muted { fill: #8b949e; }

    @media (prefers-color-scheme: light) {
      .card { fill: #ffffff; stroke: #d0d7de; }
      .title { fill: #1f2328; }
      .text { fill: #24292f; }
      .muted { fill: #656d76; }
    }
  </style>

  <rect class="card" x="0.5" y="0.5" width="519" height="169" rx="12" />

  <text class="title" x="24" y="32">Areas</text>

  <circle class="muted" cx="27" cy="67" r="2.5" />
  <text class="text" x="40" y="72">Software Engineering</text>

  <circle class="muted" cx="27" cy="103" r="2.5" />
  <text class="text" x="40" y="108">UI/UX · Design Systems</text>

  <circle class="muted" cx="27" cy="139" r="2.5" />
  <text class="text" x="40" y="144">AI · Hardware · Electronics · Tools</text>
</svg>
