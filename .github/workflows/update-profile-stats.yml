name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub snapshot
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const query = `
              query($login: String!) {
                user(login: $login) {
                  repositories(ownerAffiliations: OWNER, privacy: PUBLIC) {
                    totalCount
                  }
                  contributionsCollection {
                    totalCommitContributions
                    totalRepositoriesWithContributedCommits
                  }
                }
              }
            `;

            const { user } = await github.graphql(query, { login: 'ThiagoAciole' });
            const commits = user.contributionsCollection.totalCommitContributions;
            const repos = user.repositories.totalCount;
            const contributed = user.contributionsCollection.totalRepositoriesWithContributedCommits;

            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="520" height="170" viewBox="0 0 520 170" role="img" aria-labelledby="title desc">
              <title id="title">GitHub Snapshot</title>
              <desc id="desc">GitHub commits, repositories and contributed repositories</desc>
              <style>
                .card { fill: #0d1117; stroke: #30363d; }
                .title { fill: #f0f6fc; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
                .value { fill: #f0f6fc; font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
                .label { fill: #8b949e; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
                @media (prefers-color-scheme: light) {
                  .card { fill: #ffffff; stroke: #d0d7de; }
                  .title, .value { fill: #1f2328; }
                  .label { fill: #656d76; }
                }
              </style>
              <rect class="card" x="0.5" y="0.5" width="519" height="169" rx="12" />
              <text class="title" x="24" y="32">GitHub</text>
              <text class="value" x="24" y="92">${commits}</text>
              <text class="label" x="24" y="116">Commits · 12 mo</text>
              <text class="value" x="196" y="92">${repos}</text>
              <text class="label" x="196" y="116">Repos</text>
              <text class="value" x="352" y="92">${contributed}</text>
              <text class="label" x="352" y="116">Contributed · 12 mo</text>
            </svg>`;

            fs.mkdirSync('assets', { recursive: true });
            fs.writeFileSync('assets/github.svg', svg);

      - name: Commit updated stats
        run: |
          if git diff --quiet -- assets/github.svg; then
            echo "No stats changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github.svg
          git commit -m "chore: update profile stats"
          git push
