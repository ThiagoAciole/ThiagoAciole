name: Update contribution heatmap

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/aciole-contributions.yml'
  schedule:
    - cron: '13 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify monthly activity generator
        run: npm test
      - name: Generate lifetime SVGs from GitHub GraphQL
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ThiagoAciole
        run: npm run generate
      - name: Commit regenerated images
        run: |
          git add assets/github-activity.svg assets/github-activity-mobile.svg
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: refresh lifetime GitHub activity'
          git push
